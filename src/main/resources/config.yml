# Dash Admin Dashboard Configuration

# Web server port for the admin dashboard
port: 8080

# NeoBridge slave-mode integration for NeoDash master panel
bridge:
  enabled: true
  secret: ""
  master_url: ""

# Experimental sections shown only when Beta is enabled in Settings.
beta:
  enabled: false

# Database settings for player data tracking
database:
  type: sqlite
  file: dash.db

# Backup settings
backups:
  directory: backups
  max-backups: 10

# Optional host/IP used for IP-based setup links when Panel URL is blank.
server-ip: ""

# Use the Panel URL as the browser-facing HTTPS URL for setup and NeoDash bridge redirects.
ssl-enabled: false

# Optional public base URL for clickable setup links (e.g. https://panel.example.com)
panel-url: ""

# Optional public URL of this plugin dashboard used only for anonymous report links.
# Leave blank to derive it from server-ip, ssl-enabled and the local web port.
report-url: ""

# Trust X-Forwarded-For/X-Real-IP only behind a reverse proxy that overwrites them.
proxy:
  trust-forwarded-headers: false

# Optional Discord webhook for setup-required notifications
setup-discord-webhook-url: ""

# Legacy single Discord webhook field (kept for compatibility)
discord:
  webhook_url: ""

# Discord webhooks for event notifications
# Each entry has a URL and a list of subscribed events:
# audit, chat, server_start_stop, console_warnings, sso_requests
discord-webhooks: []
# Example:
# discord-webhooks:
#   - url: "https://discord.com/api/webhooks/..."
#     events:
#       - audit
#       - server_start_stop
#       - sso_requests

# GitHub updater (public repository)
updater:
  github-repo: "Framepersecond/ForgeDash"
  asset-keyword: "forgedash"

